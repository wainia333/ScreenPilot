[package]
name = "screenpilot"
version = "0.1.4"
description = "ScreenPilot desktop screen assistant"
authors = ["Wainia"]
edition = "2021"

[lib]
name = "screenpilot_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "screenpilot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
chrono = { version = "=0.4.42", features = ["serde"] }
futures-util = "=0.3.31"
hmac = "=0.12.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
md-5 = "=0.10.6"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-store = "=2.4.4"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "=2.5.7"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
arboard = "=3.6.1"
enigo = "=0.6.1"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }
xcap = "=0.9.8"
winreg = "=0.55.0"

[dev-dependencies]
proptest = "=1.11.0"
tempfile = "=3.23.0"
wiremock = "=0.6.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
