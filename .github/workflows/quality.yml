name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-compatibility:
    name: Frontend on Node ${{ matrix.node }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.19.0
          - 24.18.0
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm
        shell: pwsh
        run: npm install --global npm@11.16.0

      - name: Show locked toolchains
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend, coverage and repository contracts
        run: npm run verify:frontend

      - name: Build production frontend
        run: npm run build:ui

      - name: Audit all dependencies
        run: npm run audit:dependencies

  verify-native:
    name: Verify native Windows build and startup
    needs: frontend-compatibility
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm
        shell: pwsh
        run: npm install --global npm@11.16.0

      - name: Show locked toolchains
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned cargo-audit
        shell: pwsh
        env:
          CARGO_AUDIT_VERSION: 0.22.2
        run: |
          cargo install cargo-audit --version "=$env:CARGO_AUDIT_VERSION" --locked --force
          if ($LASTEXITCODE -ne 0) {
            throw 'cargo-audit installation failed.'
          }
          $actualVersion = cargo-audit --version
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne "cargo-audit $env:CARGO_AUDIT_VERSION") {
            throw "Unexpected cargo-audit version: $actualVersion"
          }

      - name: Audit locked Rust dependencies
        run: npm run audit:rust

      - name: Verify Rust formatting, tests and Clippy
        run: npm run verify:rust

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run browser end-to-end regression suite
        run: npm run test:e2e

      - name: Verify and build release executable
        run: npm run release -- --no-bundle

      - name: Launch real Windows application smoke test
        run: npm run smoke:windows
