name: Signed Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-windows-release
  cancel-in-progress: false

jobs:
  build-sign-verify:
    name: Build, sign and verify Windows artifacts
    runs-on: windows-2022
    environment: windows-release
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Require Authenticode release secrets
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SCREENPILOT_AUTHENTICODE_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SCREENPILOT_AUTHENTICODE_PFX_PASSWORD }}
          APPROVED_THUMBPRINT: ${{ vars.SCREENPILOT_AUTHENTICODE_CERT_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX)) {
            throw 'Missing SCREENPILOT_AUTHENTICODE_PFX_BASE64; signed release cannot continue.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw 'Missing SCREENPILOT_AUTHENTICODE_PFX_PASSWORD; signed release cannot continue.'
          }
          if ([string]::IsNullOrWhiteSpace($env:APPROVED_THUMBPRINT)) {
            throw 'Missing SCREENPILOT_AUTHENTICODE_CERT_THUMBPRINT; signed release cannot continue.'
          }
          $normalizedThumbprint = $env:APPROVED_THUMBPRINT -replace '[\s:]', ''
          if ($normalizedThumbprint -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'SCREENPILOT_AUTHENTICODE_CERT_THUMBPRINT must be a 40-character hexadecimal SHA-1 thumbprint.'
          }

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm
        shell: pwsh
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm run audit:dependencies

      - name: Install pinned cargo-audit
        shell: pwsh
        env:
          CARGO_AUDIT_VERSION: 0.22.2
        run: |
          cargo install cargo-audit --version "=$env:CARGO_AUDIT_VERSION" --locked --force
          if ($LASTEXITCODE -ne 0) {
            throw 'cargo-audit installation failed.'
          }
          $actualVersion = cargo-audit --version
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne "cargo-audit $env:CARGO_AUDIT_VERSION") {
            throw "Unexpected cargo-audit version: $actualVersion"
          }

      - name: Audit locked Rust dependencies
        run: npm run audit:rust

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run browser end-to-end regression suite
        run: npm run test:e2e

      - name: Build, Authenticode sign and verify release artifacts
        shell: pwsh
        env:
          SCREENPILOT_AUTHENTICODE_PFX_BASE64: ${{ secrets.SCREENPILOT_AUTHENTICODE_PFX_BASE64 }}
          SCREENPILOT_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.SCREENPILOT_AUTHENTICODE_PFX_PASSWORD }}
          SCREENPILOT_AUTHENTICODE_CERT_THUMBPRINT: ${{ vars.SCREENPILOT_AUTHENTICODE_CERT_THUMBPRINT }}
        run: npm run release:signed:windows

      - name: Launch signed real Windows application smoke test
        run: npm run smoke:windows

      - name: Upload verified signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenpilot-windows-signed-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/screenpilot.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt
